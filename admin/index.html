<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0C020A">
<title>Админка — портфолио Ксении</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 2 58 30 84 8 70 38 98 42 72 56 92 82 62 70 58 98 46 72 22 94 30 64 2 62 28 46 10 18 40 30Z' fill='%23F040B8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Unbounded:wght@500;700&family=Onest:wght@400;500;700&family=Caveat:wght@600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#0C020A; --panel:#170512; --panel-2:#21091B; --field:#0F030C;
  --white:#fff; --pink:#F040B8; --magenta:#C0008C; --paper:#FFE6F4; --paper-ink:#1A0012;
  --muted:#C89BB8; --dim:#8A5E7A; --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.22);
  --ok:#5BE3A0; --warn:#FFB547;
  --f-display:"Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"Onest","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-label:"Unbounded","Onest",sans-serif;
  --f-hand:"Caveat","Marker Felt",cursive;
  --r:14px; --gut:clamp(14px,3vw,32px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--white);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60vmax 50vmax at 0% 0%,rgba(192,0,140,.22),transparent 60%),radial-gradient(50vmax 45vmax at 100% 100%,rgba(240,64,184,.12),transparent 60%)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
img,video{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* buttons */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line-2);background:transparent;border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--pink);background:rgba(240,64,184,.08)}
.btn:active{transform:scale(.97)}
.btn.pink{background:var(--pink);border-color:var(--pink);color:#1A0012}
.btn.pink:hover{background:#ff5ccb}
.btn.ghost{border-color:transparent}
.btn.ghost:hover{border-color:var(--line-2)}
.btn.danger:hover{border-color:#ff5a7a;color:#ff8aa2;background:rgba(255,90,122,.08)}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:34px;height:34px;padding:0;border-radius:50%;display:inline-grid;place-items:center;border:1.5px solid transparent;background:rgba(12,2,10,.72);backdrop-filter:blur(6px)}
.icon-btn:hover{border-color:var(--pink);color:var(--pink)}
.icon-btn.on{background:var(--pink);color:#1A0012;border-color:var(--pink)}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:min(420px,100%);background:var(--paper);color:var(--paper-ink);border-radius:20px;padding:36px 30px 30px;text-align:center;position:relative;transform:rotate(-1deg);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.login-card .star{width:70px;height:70px;color:var(--pink);margin:-72px auto 10px;filter:drop-shadow(0 6px 0 #1A0012)}
.login-card h1{font:700 40px/1 var(--f-display);text-transform:uppercase;margin:0 0 6px;letter-spacing:.01em}
.login-card p{margin:0 0 22px;color:#6B2A55}
.login-card .hand{font:700 22px/1 var(--f-hand);color:var(--magenta);margin-top:18px}
.login-card .btn{width:100%;padding:14px;font-size:16px;background:var(--paper-ink);color:var(--paper);border-color:var(--paper-ink)}
.login-card .btn:hover{background:var(--magenta);border-color:var(--magenta)}
.login-err{color:#B0003A;font-size:13px;margin-top:12px}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px var(--gut);padding-top:calc(env(safe-area-inset-top,0px) + 12px);background:rgba(12,2,10,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:700 20px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.brand svg{width:26px;height:26px;color:var(--pink)}
.tabs{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:999px;border:1px solid var(--line)}
.tab{border:0;background:transparent;border-radius:999px;padding:7px 16px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--white);color:var(--paper-ink)}
.top .sp{flex:1}
.dirty-note{font:700 20px/1 var(--f-hand);color:var(--pink);white-space:nowrap}
.top .who{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.top .who img{width:28px;height:28px;border-radius:50%}
@media (max-width:820px){
  .top{flex-wrap:wrap;gap:10px}
  .brand span{display:none}
  .top .sp{display:none}
  .tabs{order:3;width:100%}
  .tab{flex:1}
  .top .who .name,.dirty-note{display:none}
  .top .pub{margin-left:auto}
}

main{padding:22px var(--gut) 120px;max-width:1400px;margin:0 auto}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:6px 0 20px;flex-wrap:wrap}
.head h2{font:700 clamp(30px,5vw,46px)/1 var(--f-display);text-transform:uppercase;margin:0}
.head p{margin:6px 0 0;color:var(--muted)}
.hint{font:700 19px/1.1 var(--f-hand);color:var(--pink)}

/* works grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;text-align:left;padding:0;display:flex;flex-direction:column}
.card:hover{border-color:var(--pink);transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.4)}
.card .thumb{aspect-ratio:4/5;background:var(--field);position:relative;overflow:hidden}
.card .thumb img,.card .thumb video{width:100%;height:100%;object-fit:cover}
.card .empty-cover{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--dim);font:700 22px/1.1 var(--f-hand);padding:20px;background-image:radial-gradient(circle,rgba(192,0,140,.35) 1.4px,transparent 1.6px);background-size:10px 10px}
.card .meta{padding:10px 12px 12px}
.card h3{margin:0;font:700 17px/1.15 var(--f-display);text-transform:uppercase;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.card .tg{color:var(--dim);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.touch-only{display:none}
@media (pointer:coarse){.mouse-only{display:none}.touch-only{display:inline}}
.card .badges{position:absolute;left:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap}
.badge{font:600 11px/1 var(--f-label);text-transform:uppercase;padding:5px 8px;border-radius:999px;background:var(--pink);color:#1A0012}
.badge.off{background:#2b1526;color:var(--muted);border:1px solid var(--line-2)}
.card .q{position:absolute;right:8px;top:8px;display:flex;gap:6px;opacity:0;transition:opacity .15s}
.card:hover .q,.card:focus-within .q{opacity:1}
@media (pointer:coarse){.card .q{opacity:1}}
.card.is-hidden .thumb>img,.card.is-hidden .thumb>video{opacity:.35;filter:grayscale(.6)}
.card.add{border:2px dashed var(--line-2);background:transparent;align-items:center;justify-content:center;min-height:240px;color:var(--muted);gap:8px;text-align:center}
.card.add:hover{color:var(--pink)}
@media (max-width:560px){.card.add{grid-column:1/-1;min-height:0;flex-direction:row;padding:14px}.card.add .plus{width:40px;height:40px;font-size:24px}}
.card.add .plus{width:56px;height:56px;border-radius:50%;background:var(--pink);color:#1A0012;display:grid;place-items:center;font-size:30px;font-weight:700}
.sortable-ghost{opacity:.3}
.sortable-chosen{box-shadow:0 0 0 3px var(--pink)}

/* editor drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;backdrop-filter:blur(2px)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(980px,100vw);z-index:41;background:var(--ground);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-30px 0 80px rgba(0,0,0,.5);animation:slide .25s cubic-bezier(.2,.9,.25,1)}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.d-top{display:flex;align-items:center;gap:10px;padding:12px var(--gut);padding-top:calc(env(safe-area-inset-top,0px) + 12px);border-bottom:1px solid var(--line);background:var(--panel)}
.d-top .crumb{color:var(--muted);font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d-body{flex:1;overflow:auto;padding:20px var(--gut) 60px}
.title-in{width:100%;background:transparent;border:0;border-bottom:2px solid var(--line-2);font:700 clamp(28px,4.4vw,44px)/1.1 var(--f-display);text-transform:uppercase;padding:4px 0 8px;outline:none}
.title-in:focus{border-color:var(--pink)}
.title-in::placeholder{color:var(--dim)}
.toggles{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
.tgl{display:inline-flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;border-radius:999px;border:1.5px solid var(--line-2);cursor:pointer;user-select:none;font-weight:600;font-size:14px}
.tgl input{appearance:none;width:34px;height:20px;border-radius:999px;background:#3a2034;position:relative;margin:0;cursor:pointer;transition:background .15s}
.tgl input::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.tgl input:checked{background:var(--pink)}
.tgl input:checked::after{transform:translateX(14px)}
.tgl:has(input:checked){border-color:var(--pink)}

.sec{margin-top:26px}
.sec>h4,.lbl{display:flex;align-items:center;gap:8px;margin:0 0 10px;font:600 12px/1 var(--f-label);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sec>h4 .cnt{color:var(--pink)}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.row{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f>span{font-size:13px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;gap:8px}
.f>span em{font-style:normal;color:var(--dim);font-size:12px}
.f>span em.over{color:var(--warn)}
.in{width:100%;background:var(--field);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;transition:border-color .15s;resize:vertical}
.in:hover{border-color:var(--line-2)}
.in:focus{border-color:var(--pink)}
textarea.in{min-height:84px;line-height:1.5}
.note{font-size:12.5px;color:var(--dim);margin-top:2px}
.note b{color:var(--pink);font-weight:600}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line-2);background:transparent;border-radius:999px;padding:7px 14px;font-weight:600;font-size:13.5px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#1A0012}

/* slides */
.drop{border:2px dashed var(--line-2);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted);transition:border-color .15s,background .15s;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.drop:hover,.drop.over{border-color:var(--pink);background:rgba(240,64,184,.06);color:var(--white)}
.drop b{color:var(--white)}
.drop .big{font:700 22px/1 var(--f-hand);color:var(--pink)}
.slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:14px}
@media (max-width:560px){.slides{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.sl{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.sl.is-cover{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink)}
.sl .pic{aspect-ratio:4/5;background:var(--field);position:relative;cursor:grab;overflow:hidden}
.sl .pic:active{cursor:grabbing}
.sl .pic img,.sl .pic video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.sl .num{position:absolute;left:8px;bottom:8px;font:600 11px/1 var(--f-label);padding:5px 7px;border-radius:6px;background:rgba(12,2,10,.8)}
.sl .kind{position:absolute;right:8px;bottom:8px;font:600 11px/1 var(--f-label);padding:5px 7px;border-radius:6px;background:var(--paper);color:var(--paper-ink);display:flex;gap:4px;align-items:center}
.sl .kind svg{width:12px;height:12px}
.sl .ctl{position:absolute;right:6px;top:6px;display:flex;gap:6px}
.sl .cov{position:absolute;left:8px;top:8px}
.sl .cap{border:0;border-top:1px solid var(--line);background:transparent;padding:9px 10px;font-size:13px;outline:none;width:100%}
.sl .cap:focus{background:var(--field)}
.sl .cap::placeholder{color:var(--dim)}
.sl .new-dot{position:absolute;left:46px;bottom:8px;font:600 10px/1 var(--f-label);background:var(--ok);color:#012;padding:4px 7px;border-radius:999px;text-transform:uppercase}

.cover-box{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.cover-box .cv{width:96px;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:var(--field);flex:none}
.cover-box .cv img,.cover-box .cv video{width:100%;height:100%;object-fit:cover}
.cover-box .txt{flex:1;min-width:180px;color:var(--muted);font-size:13.5px}
.cover-box .txt b{color:var(--white);display:block;font-size:15px;margin-bottom:2px}

/* texts */
.texts{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:start}
.tnav{position:sticky;top:84px;display:flex;flex-direction:column;gap:2px}
.tnav a{color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:10px;font-weight:600;font-size:14px}
.tnav a:hover{background:var(--panel);color:var(--white)}
@media (max-width:820px){
  .texts{grid-template-columns:1fr}
  .tnav{position:static;flex-direction:row;overflow:auto;gap:6px;margin:0 calc(var(--gut) * -1);padding:0 var(--gut);scrollbar-width:none}
  .tnav a{border:1px solid var(--line);border-radius:999px;white-space:nowrap}
}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:22px;scroll-margin-top:90px}
@media (max-width:560px){.box{padding:16px}}
.box>h3{font:700 26px/1 var(--f-display);text-transform:uppercase;margin:0 0 4px}
.box>.sub{color:var(--muted);margin:0 0 18px;font-size:13.5px}
.stack{display:flex;flex-direction:column;gap:14px}
.item{display:flex;gap:10px;align-items:flex-start;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.item>.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.grip{cursor:grab;color:var(--dim);padding:6px 2px;flex:none;touch-action:none}
.grip:hover{color:var(--pink)}
.item .rm{flex:none}
.add-row{align-self:flex-start}
.skill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.skill{display:flex;gap:8px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:8px}
.skill .in{padding:8px 10px}
.ipick{position:relative;flex:none}
.ipick>summary{list-style:none;width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line-2);display:grid;place-items:center;cursor:pointer;color:var(--pink)}
.ipick>summary::-webkit-details-marker{display:none}
.ipick[open]>summary{border-color:var(--pink)}
.ipick .pop{position:absolute;z-index:30;top:46px;left:0;background:var(--ground);border:1.5px solid var(--pink);border-radius:12px;padding:8px;display:grid;grid-template-columns:repeat(5,38px);gap:4px;box-shadow:0 20px 40px rgba(0,0,0,.6)}
.ipick .pop button{width:38px;height:38px;border-radius:8px;border:1px solid transparent;background:transparent;display:grid;place-items:center}
.ipick .pop button:hover{border-color:var(--line-2)}
.ipick .pop button[aria-pressed="true"]{background:var(--pink);color:#1A0012}
.seg{display:flex;gap:6px}
.seg button{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--line-2);background:transparent;display:grid;place-items:center;color:var(--muted)}
.seg button svg{width:22px;height:22px}
.seg button[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#1A0012}

/* toast + overlay */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translate(-50%,20px);opacity:0;z-index:90;background:var(--paper);color:var(--paper-ink);padding:12px 18px;border-radius:12px;font-weight:600;box-shadow:0 14px 40px rgba(0,0,0,.5);transition:all .25s;max-width:calc(100vw - 32px);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:#ff5a7a;color:#fff}
.busy{position:fixed;inset:0;z-index:80;background:rgba(12,2,10,.82);display:grid;place-items:center;text-align:center;padding:24px}
.busy .spin{width:64px;height:64px;color:var(--pink);margin:0 auto 14px;animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.busy b{display:block;font:700 26px/1 var(--f-display);text-transform:uppercase}
.busy span{color:var(--muted)}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="spiky" viewBox="0 0 100 100"><path d="M50 2 58 30 84 8 70 38 98 42 72 56 92 82 62 70 58 98 46 72 22 94 30 64 2 62 28 46 10 18 40 30Z" fill="currentColor"/></symbol>
  <symbol id="spark" viewBox="0 0 100 100"><path d="M50 0C54 34 66 46 100 50 66 54 54 66 50 100 46 66 34 54 0 50 34 46 46 34 50 0Z" fill="currentColor"/></symbol>
  <symbol id="heart" viewBox="0 0 100 100"><path d="M50 88C18 64 4 48 4 30 4 16 15 6 28 6c10 0 17 6 22 14 5-8 12-14 22-14 13 0 24 10 24 24 0 18-14 34-46 58Z" fill="currentColor"/></symbol>
  <symbol id="bolt" viewBox="0 0 100 100"><path d="M58 2 14 58h28L34 98 86 36H56Z" fill="currentColor"/></symbol>
</svg>

<div id="app"><div class="loading">Загрузка…</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="sortable.min.js"></script>
<script>
/* ============================================================
   Админка портфолио. Читает и пишет data/projects.json и data/site.json
   в GitHub-репозитории через GitHub API. Вход — через /api/auth (GitHub OAuth).
   Все изменения копятся локально и уходят одним коммитом по кнопке «Опубликовать».
   Старая админка (Decap CMS) лежит в /admin/old/.
   ============================================================ */
const REPO = "accgrap-ops/portfolio-site", BRANCH = "main", API = "https://api.github.com";
const UPLOADS = "img/uploads";
const TOKEN_KEY = "hw-admin-token";
const CATEGORIES = ["Айдентика","Иллюстрация","Музыка","Мерч","SMM","Маркетплейсы","Полиграфия"];
const ICON = {
  layers:'<path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 13 10 5 10-5"/>',
  pen:'<path d="M12 19 19 12l3 3-7 7-3-3Z"/><path d="m18 13-1.5-7.5L3 2l3.5 13.5L14 17l4-4Z"/><path d="m3 2 7.6 7.6"/><circle cx="11" cy="11" r="2"/>',
  layout:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>',

/* ---------- GitHub API ---------- */
async function gh(path, opts = {}){
  const r = await fetch(API + path, {
    method: opts.method || "GET",
    headers: { Authorization: `Bearer ${S.token}`, Accept: "application/vnd.github+json", ...(opts.body ? {"Content-Type":"application/json"} : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    cache: "no-store"
  });
  if (r.status === 401) { logout(); throw new Error("Вход устарел — войди ещё раз."); }
  const data = r.status === 204 ? null : await r.json().catch(() => null);
  if (!r.ok) throw new Error((data && data.message) || `GitHub ответил ${r.status}`);
  return data;
}
const b64ToText = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, "")), c => c.charCodeAt(0)));
const fileToB64 = file => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = () => rej(fr.error); fr.readAsDataURL(file); });

/* ---------- auth (same handshake Decap uses, so /api/auth + /api/callback stay as they are) ---------- */
function login(){
  const w = 600, h = 700, left = screenX + (outerWidth - w) / 2, top = screenY + (outerHeight - h) / 2;
  const pop = open("/api/auth?provider=github&scope=repo", "gh-login", `width=${w},height=${h},left=${left},top=${top}`);
  if (!pop) { say("Браузер заблокировал окно входа — разреши всплывающие окна.", true); return; }
  const onMsg = e => {
    if (e.origin !== location.origin || typeof e.data !== "string") return;
    if (e.data === "authorizing:github") { e.source && e.source.postMessage("authorizing:github", e.origin); return; }
    const m = e.data.match(/^authorization:github:(success|error):(.*)$/s);
    if (!m) return;
    removeEventListener("message", onMsg);
    let payload = {}; try { payload = JSON.parse(m[2]); } catch (_) {}
    if (m[1] === "success" && payload.token) {
      S.token = payload.token; try { localStorage.setItem(TOKEN_KEY, S.token); } catch (_) {}
      boot();
    } else renderLogin(payload.message || "Не получилось войти.");
  };
  addEventListener("message", onMsg);
}
function logout(){
  S.token = null; try { localStorage.removeItem(TOKEN_KEY); } catch (_) {}
  renderLogin();
}
function renderLogin(err){
  $("#app").innerHTML = `<div class="login"><div class="login-card">
    <svg class="star" viewBox="0 0 100 100"><use href="#spiky"/></svg>
    <h1>Админка</h1><p>Работы и тексты сайта-портфолио</p>
    <button class="btn" id="login">Войти через GitHub</button>
    ${err ? `<div class="login-err">${esc(err)}</div>` : ""}
    <div class="hand">всё, что поменяешь, увидишь на сайте через минуту ✦</div>
  </div></div>`;
  $("#login").onclick = login;
}

/* ---------- load ---------- */
async function boot(){
  if (!S.token) return renderLogin();
  $("#app").innerHTML = `<div class="loading">Загружаю работы…</div>`;
  try {
    const [user, repo] = await Promise.all([gh("/user"), gh(`/repos/${REPO}`)]);
    if (repo.permissions && !repo.permissions.push) throw new Error(`У аккаунта ${user.login} нет прав на запись в ${REPO}.`);
    S.user = user;
    await loadData();
    renderApp();
  } catch (e) {
    if (S.token) renderLogin(e.message);
  }
}
async function loadData(){
  for (const k of ["projects", "site"]) {
    const f = await gh(`/repos/${REPO}/contents/${FILES[k]}?ref=${BRANCH}`);
    const text = b64ToText(f.content);
    S[k] = JSON.parse(text); S.orig[k] = JSON.stringify(S[k]); S.sha[k] = f.sha;
  }
  if (!Array.isArray(S.projects.projects)) S.projects.projects = [];
}

/* ---------- media helpers ---------- */
const norm = src => src ? "/" + String(src).replace(/^\/+/, "") : "";
function mediaURL(src, w = 480){
  if (!src) return "";
  const p = norm(src), m = S.media.get(p);
  if (m) return m.url;
  if (ON_VERCEL && !isVid(p) && p.startsWith("/" + UPLOADS + "/")) return `/_vercel/image?url=${encodeURIComponent(p)}&w=${w}&q=75`;
  return p;
}
function mediaTag(src, alt = ""){
  if (!src) return "";
  const u = mediaURL(src);
  return isVid(src)
    ? `<video src="${esc(u)}#t=0.1" muted playsinline preload="metadata"></video>`
    : `<img src="${esc(u)}" data-orig="${esc(norm(src))}" alt="${esc(alt)}" loading="lazy" decoding="async" onerror="if(this.dataset.orig&&this.src.indexOf('_vercel')>-1)this.src=this.dataset.orig">`;
}
const TR = {а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"e",ж:"zh",з:"z",и:"i",й:"y",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"h",ц:"c",ч:"ch",ш:"sh",щ:"sch",ъ:"",ы:"y",ь:"",э:"e",ю:"yu",я:"ya",ў:"o",қ:"q",ғ:"g",ҳ:"h"};
function safeName(name){
  const dot = name.lastIndexOf("."), ext = (dot > 0 ? name.slice(dot + 1) : "").toLowerCase().replace(/[^a-z0-9]/g, "") || "bin";
  const base = (dot > 0 ? name.slice(0, dot) : name).toLowerCase().split("").map(c => TR[c] ?? c).join("")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40) || "file";
  return `${base}-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 5)}.${ext}`;
}
const MAX_MB = 90, WARN_MB = 25;
function stage(file){
  const mb = file.size / 1048576, vid = file.type.startsWith("video/") || isVid(file.name);
  if (!file.type.startsWith("image/") && !vid) { say(`«${file.name}» — не картинка и не видео, пропускаю.`, true); return null; }
  if (mb > MAX_MB) { say(`«${file.name}» весит ${mb.toFixed(0)} МБ — GitHub не примет файл больше ${MAX_MB} МБ. Сожми его.`, true); return null; }
  if (vid && /\.mov$/i.test(file.name)) say(`«${file.name}» — .mov может не играть в Chrome. Лучше MP4.`, true);
  else if (mb > WARN_MB) say(`«${file.name}» тяжёлый (${mb.toFixed(0)} МБ) — страница будет грузиться дольше.`, true);
  const path = `/${UPLOADS}/${safeName(file.name)}`;
  S.media.set(path, { file, url: URL.createObjectURL(file), uploaded: false });
  return { path, vid };
}

      <div class="cover-box">

        <div class="txt">${p.cover ? `<b>Выбрана своя обложка</b>${(p.slides||[]).some(s => norm(s.image||s.video) === norm(p.cover)) ? "Один из слайдов." : "Отдельная картинка, не из слайдов."}` : `<b>Авто — первый слайд</b>Нажми ★ на слайде или загрузи отдельную. Лучше вертикальная 4:5.`}</div>
        <label class="btn">${ic("upload")}<span>Загрузить</span><input type="file" id="cover-file" accept="image/*,video/*" hidden></label>
        ${p.cover ? `<button class="btn ghost" id="cover-reset">Сбросить</button>` : ""}
      </div>
    </div>

    <div class="sec">
      <h4>Категории <span class="note" style="text-transform:none;letter-spacing:0;font-family:var(--f-body)">— по ним работают фильтры на сайте</span></h4>
      <div class="chips" id="tags">${CATEGORIES.map(c => `<button type="button" class="chip" aria-pressed="${p.tags.includes(c)}" data-tag="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    </div>

    <div class="sec row">
      <label class="f"><span>Клиент / для кого</span><input class="in" data-k="client" value="${esc(p.client)}" placeholder="например, поп-панк группа"></label>
      <label class="f"><span>Год</span><input class="in" data-k="year" value="${esc(p.year)}" placeholder="2026" inputmode="numeric"></label>
    </div>
    <div class="sec">
      <label class="f"><span>Короткое описание</span><textarea class="in" data-k="desc" rows="4" placeholder="Что сделала в проекте — 1–3 предложения">${esc(p.desc)}</textarea></label>
    </div>`;

  const body = $("#d-body");
  body.oninput = e => {
    const t = e.target, k = t.dataset.k;
    if (k) { p[k] = t.type === "checkbox" ? t.checked : t.value; if (k === "title") $(".drawer .crumb").textContent = t.value || "Новый проект"; refreshDirty(); }
    if (t.dataset.cap != null) { const s = p.slides[+t.dataset.cap]; if (t.value) s.caption = t.value; else delete s.caption; refreshDirty(); }
  };
  $("#tags").onclick = e => { const b = e.target.closest(".chip"); if (!b) return; const c = b.dataset.tag;
    p.tags = p.tags.includes(c) ? p.tags.filter(x => x !== c) : CATEGORIES.filter(x => x === c || p.tags.includes(x));
    b.setAttribute("aria-pressed", p.tags.includes(c)); refreshDirty(); };

  const addFiles = files => {
    let n = 0;
    [...files].forEach(f => { const st = stage(f); if (!st) return; p.slides.push(st.vid ? { video: st.path } : { image: st.path }); n++; });
    if (n) { renderEditor(); refreshDirty(); say(`Добавлено: ${n} ${plural(n,"файл","файла","файлов")}`); }
  };
  $("#file").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
  const drop = $("#drop");
  ["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { if (![...e.dataTransfer.types].includes("Files")) return; e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave","drop"].forEach(ev => drop.addEventListener(ev, () => drop.classList.remove("over")));
  drop.addEventListener("drop", e => { e.preventDefault(); addFiles(e.dataTransfer.files); });

  $("#cover-file").onchange = e => { const f = e.target.files[0]; if (!f) return; const st = stage(f); if (st) { p.cover = st.path; renderEditor(); refreshDirty(); } };
  const cr = $("#cover-reset"); if (cr) cr.onclick = () => { p.cover = ""; renderEditor(); refreshDirty(); };

  const box = $("#slides");
  box.onclick = e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const i = +b.closest(".sl").dataset.i, s = p.slides[i], src = s.video || s.image;
    if (b.dataset.act === "del") { p.slides.splice(i, 1); if (norm(p.cover) === norm(src)) p.cover = ""; }
    if (b.dataset.act === "cover") p.cover = norm(p.cover) === norm(src) ? "" : src;
    if (b.dataset.act === "play") { const v = b.closest(".sl").querySelector("video"); if (v) { v.paused ? v.play() : v.pause(); } return; }
    renderEditor(); refreshDirty();
  };
  Sortable.create(box, { animation: 180, handle: ".pic", delay: 160, delayOnTouchOnly: true,
    onEnd: ev => { if (ev.oldIndex === ev.newIndex) return; p.slides.splice(ev.newIndex, 0, p.slides.splice(ev.oldIndex, 1)[0]); renderEditor(); refreshDirty(); } });
}
function slideCard(p, s, i){
  const src = s.video || s.image || "", isCov = p.cover ? norm(p.cover) === norm(src) : i === 0;
  const fresh = S.media.has(norm(src)) && !S.media.get(norm(src)).uploaded;
  return `<div class="sl${isCov ? " is-cover" : ""}" data-i="${i}">
    <div class="pic">${mediaTag(src)}
      <span class="num">${String(i + 1).padStart(2, "0")}</span>
      ${s.video ? `<span class="kind">${ic("video", ICON)}видео</span>` : ""}
      ${fresh ? `<span class="new-dot">новый</span>` : ""}
    </div>
    <button class="icon-btn cov${isCov ? " on" : ""}" data-act="cover" title="${isCov ? (p.cover ? "Убрать из обложки" : "Обложка (авто)") : "Сделать обложкой"}" aria-label="Обложка">${ic("star")}</button>
    <div class="ctl">${s.video ? `<button class="icon-btn" data-act="play" title="Воспроизвести" aria-label="Воспроизвести">${ic("play")}</button>` : ""}
      <button class="icon-btn" data-act="del" title="Удалить слайд" aria-label="Удалить слайд">${ic("x")}</button></div>
    <input class="cap" data-cap="${i}" value="${esc(s.caption)}" placeholder="подпись (необязательно)" aria-label="Подпись слайда ${i + 1}">
  </div>`;
}

/* ============================================================
   ТЕКСТЫ
   ============================================================ */
const getP = path => path.split(".").reduce((o, k) => o == null ? o : o[k], S.site);
function setP(path, v){ const ks = path.split("."), last = ks.pop(); let o = S.site; ks.forEach(k => { if (o[k] == null) o[k] = /^\d+$/.test(k) ? [] : {}; o = o[k]; }); o[last] = v; }
const fld = (label, path, o = {}) => {
  const v = getP(path) ?? "", tag = o.area ? "textarea" : "input";
  const counter = o.max ? `<em data-max="${o.max}" class="${String(v).length > o.max ? "over" : ""}">${String(v).length}/${o.max}</em>` : "";
  return `<label class="f"><span>${esc(label)}${counter}</span>${tag === "textarea"
    ? `<textarea class="in" data-p="${path}" rows="${o.rows || 3}" placeholder="${esc(o.ph || "")}">${esc(v)}</textarea>`
    : `<input class="in" data-p="${path}" value="${esc(v)}" placeholder="${esc(o.ph || "")}" ${o.type ? `type="${o.type}"` : ""}>`}${o.note ? `<span class="note">${o.note}</span>` : ""}</label>`;
};
const TEMPLATES = {
  "about.paragraphs": () => "",
  "about.facts": () => "",
  experience: () => ({ company: "", period: "", place: "", role: "", what: "", now: false }),
  skills: () => ({ name: "", icon: "star" }),
  services: () => ({ title: "", text: "", icon: "spiky" })
};
const grip = `<span class="grip" title="Перетащи, чтобы поменять порядок">${ic("grip")}</span>`;
const rmBtn = (list, i) => `<button class="icon-btn rm" data-act="rm" data-list="${list}" data-i="${i}" title="Удалить" aria-label="Удалить">${ic("trash")}</button>`;
const addBtn = (list, label) => `<button class="btn add-row" data-act="add" data-list="${list}">${ic("plus")}<span>${label}</span></button>`;

function renderTexts(){
  const s = S.site;
  ["about","contacts","game"].forEach(k => s[k] = s[k] || {});
  ["experience","skills","services"].forEach(k => s[k] = s[k] || []);
  s.about.paragraphs = s.about.paragraphs || []; s.about.facts = s.about.facts || [];
  $("#view").innerHTML = `
  <div class="head"><div><h2>Тексты сайта</h2><p>Всё, кроме работ. <b style="color:var(--pink)">**звёздочками**</b> в абзацах «Обо мне» выделяются слова розовым маркером.</p></div></div>
  <div class="texts">
    <nav class="tnav">
      <a href="#t-about">Обо мне</a><a href="#t-exp">Опыт</a><a href="#t-skills">Скиллы</a><a href="#t-svc">Услуги</a><a href="#t-contacts">Контакты</a><a href="#t-game">Финал игры</a>
    </nav>
    <div id="tforms">
      <section class="box" id="t-about"><h3>Обо мне</h3><p class="sub">Лист в клетку в начале сайта</p>
        <div class="stack">
          ${fld("Первая крупная фраза", "about.lead", { area: true, rows: 2 })}
          <div><div class="lbl">Абзацы</div>
            <div class="stack" data-sort="about.paragraphs">${s.about.paragraphs.map((_, i) => `<div class="item">${grip}<div class="body">${fld("", "about.paragraphs." + i, { area: true, rows: 3 })}</div>${rmBtn("about.paragraphs", i)}</div>`).join("")}</div>
            <div style="margin-top:10px">${addBtn("about.paragraphs", "Абзац")}</div></div>
          <div><div class="lbl">Плашки внизу листа</div>
            <div class="stack" data-sort="about.facts">${s.about.facts.map((_, i) => `<div class="item">${grip}<div class="body">${fld("", "about.facts." + i)}</div>${rmBtn("about.facts", i)}</div>`).join("")}</div>
            <div style="margin-top:10px">${addBtn("about.facts", "Плашка")}</div></div>
          ${fld("Подпись", "about.sign")}
        </div></section>

      <section class="box" id="t-exp"><h3>Опыт</h3><p class="sub">Сет-лист мест работы — порядок как на сайте</p>
        <div class="stack" data-sort="experience">${s.experience.map((_, i) => `<div class="item">${grip}<div class="body">
          <div class="row">${fld("Компания", `experience.${i}.company`)}${fld("Период", `experience.${i}.period`, { ph: "авг 2026 — сейчас" })}</div>
          <div class="row">${fld("Должность", `experience.${i}.role`)}${fld("Город", `experience.${i}.place`)}</div>
          ${fld("Что делала", `experience.${i}.what`, { area: true, rows: 2 })}
          <label class="tgl" style="align-self:flex-start"><input type="checkbox" data-p="experience.${i}.now" ${s.experience[i].now ? "checked" : ""}>Работаю здесь сейчас («сейчас играет»)</label>
        </div>${rmBtn("experience", i)}</div>`).join("")}</div>
        <div style="margin-top:12px">${addBtn("experience", "Место работы")}</div>
        <div style="margin-top:18px">${fld("Образование", "education")}</div></section>

      <section class="box" id="t-skills"><h3>Мои скиллы</h3><p class="sub">Названия — коротко, до 14 букв, иначе текст по кругу станет мелким</p>
        <div class="skill-grid" data-sort="skills">${s.skills.map((sk, i) => `<div class="skill">${grip}
          <details class="ipick"><summary title="Иконка">${ic(sk.icon, ICON)}</summary><div class="pop">${Object.keys(ICON).map(k => `<button type="button" data-icon="${k}" data-path="skills.${i}.icon" aria-pressed="${sk.icon === k}" title="${k}">${ic(k, ICON)}</button>`).join("")}</div></details>
          <input class="in" data-p="skills.${i}.name" value="${esc(sk.name)}" placeholder="Название" maxlength="24" aria-label="Название скилла">
          ${rmBtn("skills", i)}</div>`).join("")}</div>
        <div style="margin-top:12px">${addBtn("skills", "Скилл")}</div></section>

      <section class="box" id="t-svc"><h3>Что я делаю</h3><p class="sub">Карточки услуг</p>
        <div class="stack" data-sort="services">${s.services.map((sv, i) => `<div class="item">${grip}<div class="body">
          <div class="seg">${SVC_ICONS.map(([k, n]) => `<button type="button" data-icon="${k}" data-path="services.${i}.icon" aria-pressed="${sv.icon === k}" title="${n}"><svg viewBox="0 0 100 100"><use href="#${k}"/></svg></button>`).join("")}</div>
          ${fld("Заголовок", `services.${i}.title`)}${fld("Текст", `services.${i}.text`, { area: true, rows: 2 })}
        </div>${rmBtn("services", i)}</div>`).join("")}</div>
        <div style="margin-top:12px">${addBtn("services", "Услуга")}</div></section>

      <section class="box" id="t-contacts"><h3>Контакты</h3><p class="sub">Отрывные листочки внизу сайта</p>
        <div class="stack">${fld("Почта", "contacts.email", { type: "email" })}
          <div class="row">${fld("Telegram (без @)", "contacts.telegram")}${fld("Телефон", "contacts.phone", { type: "tel" })}</div></div></section>

      <section class="box" id="t-game"><h3>Финал игры с наклейками</h3><p class="sub">Показывается, когда найдены все наклейки</p>
        <div class="stack">${fld("Заголовок", "game.title")}
          ${fld("Текст", "game.text", { area: true, rows: 3, note: "Слово <b>{код}</b> заменится на кодовое слово в чёрной плашке" })}
          ${fld("Кодовое слово", "game.code")}</div></section>
    </div>
  </div>`;

  const root = $("#tforms");
  root.oninput = e => {
    const t = e.target, path = t.dataset.p; if (!path) return;
    setP(path, t.type === "checkbox" ? t.checked : t.value);
    const em = t.closest(".f") && t.closest(".f").querySelector("em[data-max]");
    if (em) { em.textContent = `${t.value.length}/${em.dataset.max}`; em.classList.toggle("over", t.value.length > +em.dataset.max); }
    refreshDirty();
  };
  root.onclick = e => {
    const ib = e.target.closest("[data-icon]");
    if (ib) { setP(ib.dataset.path, ib.dataset.icon); keepScroll(renderTexts); refreshDirty(); return; }
    const b = e.target.closest("[data-act]"); if (!b) return;
    const arr = getP(b.dataset.list);
    if (b.dataset.act === "rm") arr.splice(+b.dataset.i, 1);
    if (b.dataset.act === "add") arr.push(TEMPLATES[b.dataset.list]());
    keepScroll(renderTexts); refreshDirty();
    if (b.dataset.act === "add") { const items = document.querySelectorAll(`[data-sort="${b.dataset.list}"] > *`); const last = items[items.length - 1]; last && last.querySelector("input,textarea") && last.querySelector("input,textarea").focus(); }
  };
  root.querySelectorAll("[data-sort]").forEach(el => Sortable.create(el, { animation: 160, handle: ".grip",
    onEnd: ev => { if (ev.oldIndex === ev.newIndex) return; const a = getP(el.dataset.sort); a.splice(ev.newIndex, 0, a.splice(ev.oldIndex, 1)[0]); keepScroll(renderTexts); refreshDirty(); } }));
  root.querySelectorAll(".ipick").forEach(d => d.addEventListener("toggle", () => { if (d.open) root.querySelectorAll(".ipick[open]").forEach(o => o !== d && (o.open = false)); }));
}
function keepScroll(fn){ const y = scrollY; fn(); scrollTo(0, y); }

/* ============================================================
   ПУБЛИКАЦИЯ — одним коммитом: новые файлы + изменённые JSON
   ============================================================ */
function usedMedia(){
  const used = new Set();
  P().forEach(p => { if (p.cover) used.add(norm(p.cover)); (p.slides || []).forEach(s => { if (s.image) used.add(norm(s.image)); if (s.video) used.add(norm(s.video)); }); });
  return used;
}
function busy(title, sub){
  let b = $("#busy");
  if (title == null) { b && b.remove(); return; }
  if (!b) { b = document.createElement("div"); b.id = "busy"; b.className = "busy"; document.body.appendChild(b); }
  b.innerHTML = `<div><svg class="spin" viewBox="0 0 100 100"><use href="#spiky"/></svg><b>${esc(title)}</b><span>${esc(sub || "")}</span></div>`;
}
async function publish(){
  if (!isDirty()) return;
  const changed = ["projects", "site"].filter(dirtyOf);
  const used = usedMedia();
  const toUpload = [...S.media].filter(([path, m]) => !m.uploaded && used.has(path));
  try {
    busy("Публикую…", "проверяю, не менялось ли что-то параллельно");
    const ref = await gh(`/repos/${REPO}/git/ref/heads/${BRANCH}`), head = ref.object.sha;
    for (const k of changed) {
      const cur = await gh(`/repos/${REPO}/contents/${FILES[k]}?ref=${head}`);
      if (cur.sha !== S.sha[k] && !confirm(`Файл ${FILES[k]} кто-то изменил после того, как ты открыла админку (например, в старой админке). Перезаписать его твоей версией?`)) { busy(); return; }
    }
    const commit = await gh(`/repos/${REPO}/git/commits/${head}`);
    const tree = [];
    let done = 0;
    for (const [path, m] of toUpload) {
      busy("Загружаю файлы…", `${++done} из ${toUpload.length} · ${m.file.name}`);
      const blob = await gh(`/repos/${REPO}/git/blobs`, { method: "POST", body: { content: await fileToB64(m.file), encoding: "base64" } });
      tree.push({ path: path.slice(1), mode: "100644", type: "blob", sha: blob.sha });
    }
    busy("Сохраняю…", "ещё секунду");
    const jsonSha = {};
    for (const k of changed) {
      const blob = await gh(`/repos/${REPO}/git/blobs`, { method: "POST", body: { content: JSON.stringify(S[k], null, 2) + "\n", encoding: "utf-8" } });
      jsonSha[k] = blob.sha;
      tree.push({ path: FILES[k], mode: "100644", type: "blob", sha: blob.sha });
    }
    const t = await gh(`/repos/${REPO}/git/trees`, { method: "POST", body: { base_tree: commit.tree.sha, tree } });
    const what = changed.map(k => k === "projects" ? "работы" : "тексты").join(" и ");
    const c = await gh(`/repos/${REPO}/git/commits`, { method: "POST", body: { message: `Админка: обновлены ${what}` + (toUpload.length ? ` (+${toUpload.length} ${plural(toUpload.length,"файл","файла","файлов")})` : ""), tree: t.sha, parents: [head] } });
    await gh(`/repos/${REPO}/git/refs/heads/${BRANCH}`, { method: "PATCH", body: { sha: c.sha } });
    toUpload.forEach(([, m]) => m.uploaded = true);
    changed.forEach(k => { S.orig[k] = JSON.stringify(S[k]); S.sha[k] = jsonSha[k]; });
    busy(); refreshDirty();
    if (S.open >= 0) renderEditor();
    say("Опубликовано ✦ Сайт обновится примерно через минуту");
  } catch (e) {
    busy(); say("Не получилось опубликовать: " + e.message, true);
  }
}

boot();
</script>
